name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'

jobs:
  # Stage 1: Validation
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint || echo "No lint script found"
        continue-on-error: true

      - name: Check code formatting
        run: npm run format:check || echo "No format script found"
        continue-on-error: true

      - name: Type check
        run: npm run type-check || echo "No type-check script found"
        continue-on-error: true

  # Stage 2: Testing
  test:
    name: Testing
    runs-on: ubuntu-latest
    needs: validation
    services:
      mongodb:
        image: mongo:6.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        env:
          MONGO_DB_URL: mongodb://admin:password@localhost:27017/test?authSource=admin
          NODE_ENV: test
        continue-on-error: true

      - name: Generate coverage report
        run: npm run test:coverage || echo "No coverage script found"
        continue-on-error: true

  # Stage 3: Security
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Secret detection
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  # Stage 4: Build
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ecommerce-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test Docker image
        run: |
          docker run -d --name test-api -p 3000:3000 \
            -e NODE_ENV=test \
            -e MONGO_DB_URL=mongodb://localhost:27017/test \
            ecommerce-api:latest
          sleep 10
          docker logs test-api
          docker rm -f test-api

  # Stage 5: Deploy
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 134.122.77.174 >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          MONGO_DATABASE: ${{ secrets.MONGO_DATABASE }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          RESET_PASSWORD_KEY: ${{ secrets.RESET_PASSWORD_KEY }}
          AUTH_GOOGLE_CLIENT: ${{ secrets.AUTH_GOOGLE_CLIENT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
        run: |
          # Create deployment script
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e

          APP_DIR="/home/deployer/ecommerce-api"
          BACKUP_DIR="/home/deployer/backups"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          echo "Starting deployment..."

          # Create directories if they don't exist
          mkdir -p $APP_DIR
          mkdir -p $BACKUP_DIR
          mkdir -p $APP_DIR/logs
          mkdir -p $APP_DIR/nginx/logs

          # Backup current version
          if [ -d "$APP_DIR/current" ]; then
            echo "Backing up current version..."
            cp -r $APP_DIR/current $BACKUP_DIR/backup_$TIMESTAMP
          fi

          # Copy new files
          echo "Copying new files..."
          rsync -av --exclude 'node_modules' --exclude '.git' \
            --exclude 'logs' --exclude 'backups' \
            /tmp/ecommerce-api/ $APP_DIR/current/

          # Update environment file
          cat > $APP_DIR/current/.env << ENVEOF
          NODE_ENV=production
          PORT=3000
          CLIENT_URL=$CLIENT_URL
          MONGO_USERNAME=$MONGO_USERNAME
          MONGO_PASSWORD=$MONGO_PASSWORD
          MONGO_DATABASE=$MONGO_DATABASE
          SECRET_KEY=$SECRET_KEY
          RESET_PASSWORD_KEY=$RESET_PASSWORD_KEY
          AUTH_GOOGLE_CLIENT=$AUTH_GOOGLE_CLIENT
          STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY
          EMAIL_USER=$EMAIL_USER
          EMAIL_PASS=$EMAIL_PASS
          CACHE_TTL=300
          ENVEOF

          # Blue-Green deployment
          echo "Starting Blue-Green deployment..."
          cd $APP_DIR/current

          # Determine which environment to deploy
          if docker ps | grep -q "ecommerce-api-blue"; then
            TARGET="green"
            CURRENT="blue"
          else
            TARGET="blue"
            CURRENT="green"
          fi

          echo "Deploying to $TARGET environment..."

          # Stop target container if running
          docker-compose stop api-$TARGET || true
          docker-compose rm -f api-$TARGET || true

          # Start target container
          docker-compose --profile $TARGET up -d api-$TARGET

          # Wait for health check
          echo "Waiting for health check..."
          sleep 30

          # Check if new container is healthy
          if docker ps | grep -q "ecommerce-api-$TARGET"; then
            echo "Deployment to $TARGET successful!"
            
            # Update nginx to point to new container
            if [ "$TARGET" = "green" ]; then
              sed -i 's/server api-blue:3000/server api-green:3001/' nginx/conf.d/default.conf
            else
              sed -i 's/server api-green:3001/server api-blue:3000/' nginx/conf.d/default.conf
            fi
            
            # Reload nginx
            docker-compose exec nginx nginx -s reload || docker-compose restart nginx
            
            # Stop old container after delay
            sleep 10
            docker-compose stop api-$CURRENT || true
            
            echo "Deployment completed successfully!"
          else
            echo "Deployment failed! Rolling back..."
            docker-compose logs api-$TARGET
            exit 1
          fi
          EOF

          chmod +x deploy.sh

          # Copy files to VPS
          echo "Copying files to VPS..."
          rsync -avz -e ssh \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'logs' \
            --exclude 'backups' \
            . deployer@134.122.77.174:/tmp/ecommerce-api/

          # Execute deployment script on VPS
          echo "Executing deployment script on VPS..."
          ssh deployer@134.122.77.174 'bash -s' < deploy.sh

      - name: Health check
        run: |
          sleep 10
          curl -f http://134.122.77.174/health || exit 1

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "Deployment successful!"
          else
            echo "Deployment failed!"
          fi

  # Stage 6: Post-Deploy
  post-deploy:
    name: Post-Deploy Checks
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Smoke tests
        run: |
          echo "Running smoke tests..."
          curl -f http://134.122.77.174/health || exit 1
          curl -f http://134.122.77.174/api/ || exit 1

      - name: Cleanup old backups
        run: |
          ssh deployer@134.122.77.174 \
            'find /home/deployer/backups -type d -mtime +7 -exec rm -rf {} +' || true
